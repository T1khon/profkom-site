<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакты — Профком Политеха</title>
  <meta name="description" content="Адрес, часы работы и контакты профсоюзной организации Московского Политеха.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .contacts-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; }
    .map { border: 7px solid var(--blue); border-radius: 26px; overflow: hidden; min-height: 460px; background: #ddd; }
    .map iframe { width: 100%; height: 100%; min-height: 460px; border: 0; display: block; }
    @media (max-width: 900px) { .contacts-grid { grid-template-columns: 1fr; } .map, .map iframe { min-height: 340px; } }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="crumbs"><a href="index.html">Главная</a> / Контакты</div>
        <h1 class="display">Конт&shy;акты</h1>
        <p class="lead">Приходи, пиши, звони — мы всегда на твоей стороне.</p>
      </div>
      <div class="mascot" data-mascot="wave" data-theme="dark"></div>
    </section>

    <section class="section tight" style="padding-top:0">
      <div class="container">
        <div class="contacts-grid">
          <div class="grid" style="gap:16px">
            <div class="card reveal">
              <span class="pill">Адрес</span>
              <div class="h3">ул. Большая Семёновская, д. 38<br><span class="accent">Аудитория В-202</span></div>
              <p>Ближайшее метро — «Электрозаводская».</p>
            </div>
            <div class="card reveal">
              <span class="pill">Часы работы</span>
              <div class="mt-16"><span class="hours"><span>ПН–ПТ</span><span>10:30–17:30</span></span></div>
            </div>
            <div class="card reveal">
              <span class="pill">Телефоны</span>
              <div class="h3"><a href="#" data-site="phone"></a></div>
              <p><a href="#" data-site="phone2"></a></p>
            </div>
            <div class="card reveal">
              <span class="pill">Написать</span>
              <div class="grid mt-16" style="gap:10px">
                <a href="#" data-site="vk" target="_blank" rel="noopener" class="btn">Сообщество ВКонтакте</a>
                <a href="#" data-site="tg" target="_blank" rel="noopener" class="btn dark">Telegram-канал</a>
                <a href="#" data-site="bot" target="_blank" rel="noopener" class="btn ghost">Чат-бот «Твой проф»</a>
                <a href="#" data-site="email" class="btn ghost"></a>
              </div>
            </div>
          </div>
          <div class="map reveal">
            <iframe title="Карта: ул. Большая Семёновская, 38" loading="lazy"
              src="https://yandex.ru/map-widget/v1/?text=%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0%2C%20%D1%83%D0%BB.%20%D0%91%D0%BE%D0%BB%D1%8C%D1%88%D0%B0%D1%8F%20%D0%A1%D0%B5%D0%BC%D1%91%D0%BD%D0%BE%D0%B2%D1%81%D0%BA%D0%B0%D1%8F%2C%2038&z=16"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
